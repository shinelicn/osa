<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>琴澳智营 To B 经纪端 Demo</title>
  <style>html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef4f2;color:#142523;display:grid;place-items:center}.box{max-width:360px;text-align:center;padding:24px}.bar{height:4px;background:#d9e6e1;border-radius:999px;overflow:hidden;margin-top:16px}.bar span{display:block;height:100%;width:42%;background:#17695d;border-radius:999px;animation:load 1s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-60%)}to{transform:translateX(200%)}}</style>
</head>
<body>
  <div class="box"><strong>正在载入琴澳智营 Demo</strong><div class="bar"><span></span></div></div>
  <script>
    (async function(){
      const url = 'https://raw.githubusercontent.com/shinelicn/osa/gh-pages/hengqin-dual-demo/tob.html?v=' + Date.now();
      const page = await fetch(url).then(function(response){
        if (!response.ok) throw new Error('fetch failed');
        return response.text();
      });
      document.open();
      document.write(page);
      document.close();
    })().catch(function(error){
      document.body.innerHTML = '<div class="box"><strong>页面载入失败</strong><p>请稍后刷新，或使用最新版 Chrome、Safari、Edge 打开。</p></div>';
      console.error(error);
    });
  </script>
</body>
</html>
